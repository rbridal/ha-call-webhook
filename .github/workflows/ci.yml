name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install test tools
        run: pip install -r requirements_test.txt
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # topics is a GitHub repo setting (About → Topics), not a file.
          # The checkout token cannot set it. Add home-assistant, hacs,
          # hacs-integration, and custom-component, then drop this ignore.
          ignore: topics
